<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0708">
<meta name="color-scheme" content="dark">
<title>HUB</title>
<link rel="icon" href="data:,">
<!--
  The HUB: the desk tablet's front door (Hector 2026-10-28: "a HUB first with a nice background and a badass view").
  ARC with the Forge: the Lounge's gold reactor holds the clock; the Lounge, the Pit and Home sit on its orbit; while a
  cook runs, embers rise and the bottom glows like a firebox. Around the clock (his picks 10-28): power and air, the day
  orbit (sun, then moon), the hour flare, the kitchen timer (hold the clock), holiday colors. Inside the Hubs app (window.HubsApp) a pod opens that
  service; in any browser the pods are plain links. (The core's talk is out for now, his word 10-28: this tablet is too
  old; it comes back with a better one: hub commit d86b702.)
  Every moving thing is a transform or an opacity on a layer painted once: the tablet's chip only composites
  (projects/desk-tablet/README.md, "The HUB"). START HERE: README.md in this folder.
-->
<style>
@font-face{font-family:'Bebas Neue';font-weight:400;font-display:block;src:url(fonts/bebas-neue-400.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-weight:500;font-display:block;src:url(fonts/chakra-petch-500.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-weight:600;font-display:block;src:url(fonts/chakra-petch-600.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:block;src:url(fonts/ibm-plex-mono-500.woff2) format('woff2')}
:root{
  --void:#0A0708;--gold:#FFB547;--gold-hot:#FFE9B0;--gold-deep:#B8741A;--ink:#F2EAE8;--dim:#9A8C8A;--faint:#5E5250;
  --ember:#FF6A1A;--ember-hot:#FFC46B;--red:#FF3B30;--go:#3FD07A;
  --word:'Bebas Neue','Arial Narrow',Impact,sans-serif;--disp:'Chakra Petch','Trebuchet MS',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --R:190px;--rp:55px;--bgY:36%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);color:var(--ink);overflow:hidden}
body{position:fixed;inset:0;font-family:var(--disp);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
svg{overflow:visible}

/* ---- the room: painted once ---- */
#bg{position:fixed;inset:0;background:radial-gradient(ellipse 85% 60% at 50% var(--bgY),#21150D 0%,#140C08 38%,var(--void) 72%)}
#grid{position:fixed;inset:0;background-image:radial-gradient(rgba(255,181,71,.17) .9px,transparent 1.5px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 80% 62% at 50% var(--bgY),#000 0%,rgba(0,0,0,.4) 50%,transparent 82%);mask-image:radial-gradient(ellipse 80% 62% at 50% var(--bgY),#000 0%,rgba(0,0,0,.4) 50%,transparent 82%)}
#corners{position:fixed;inset:10px;pointer-events:none;z-index:6}
#corners i{position:absolute;width:22px;height:22px;border:solid rgba(255,181,71,.38);border-width:0}
#corners i:nth-child(1){left:0;top:0;border-left-width:1.5px;border-top-width:1.5px}
#corners i:nth-child(2){right:0;top:0;border-right-width:1.5px;border-top-width:1.5px}
#corners i:nth-child(3){left:0;bottom:0;border-left-width:1.5px;border-bottom-width:1.5px}
#corners i:nth-child(4){right:0;bottom:0;border-right-width:1.5px;border-bottom-width:1.5px}

/* ---- the forge: only while a cook runs ---- */
#forge{position:fixed;inset:0;opacity:0;transition:opacity 2.4s ease;pointer-events:none;z-index:1}
body.forge #forge{opacity:1}
.fg{position:absolute;left:-25%;right:-25%;bottom:-18%;height:62%;border-radius:50%;will-change:opacity,transform}
.fg.a{background:radial-gradient(ellipse at 50% 100%,rgba(255,92,18,.85) 0%,rgba(255,80,16,.36) 34%,rgba(180,40,8,.12) 56%,transparent 72%);animation:flick 3.3s ease-in-out infinite}
.fg.b{left:5%;right:5%;height:38%;bottom:-12%;background:radial-gradient(ellipse at 50% 100%,rgba(255,224,160,.62) 0%,rgba(255,150,60,.26) 38%,transparent 68%);transform-origin:50% 100%;animation:flick2 4.7s ease-in-out infinite}
@keyframes flick{0%{opacity:.72}14%{opacity:1}29%{opacity:.8}46%{opacity:.96}63%{opacity:.68}81%{opacity:.93}100%{opacity:.72}}
@keyframes flick2{0%{opacity:.55;transform:scaleY(1)}35%{opacity:.95;transform:scaleY(1.08)}62%{opacity:.7;transform:scaleY(.96)}100%{opacity:.55;transform:scaleY(1)}}
#embers,#motes{position:absolute;inset:0;overflow:hidden}
#motes{position:fixed;pointer-events:none;z-index:2}
.pt{position:absolute;bottom:-14px;border-radius:50%;will-change:transform,opacity}
.ember{background:radial-gradient(circle,#FFF6DA 0%,#FFC46B 20%,rgba(255,106,26,.85) 42%,rgba(255,80,20,0) 70%)}
.ember.red{background:radial-gradient(circle,#FFE0B0 0%,#FF8A3A 22%,rgba(230,50,10,.8) 44%,rgba(200,30,0,0) 70%)}
.mote{background:radial-gradient(circle,rgba(255,233,176,.9) 0%,rgba(255,181,71,.45) 35%,rgba(255,181,71,0) 70%)}
#scan{position:fixed;left:0;right:0;top:0;height:60px;margin-top:-30px;pointer-events:none;z-index:2;opacity:0;will-change:transform,opacity;
  background:linear-gradient(180deg,transparent,rgba(255,181,71,.035) 45%,rgba(255,233,176,.16) 50%,rgba(255,181,71,.035) 55%,transparent)}

/* ---- the reactor ---- */
#reactor{position:absolute;z-index:3;transition:transform 1.1s cubic-bezier(.2,.9,.25,1),opacity .9s ease}
#reactor>div,#reactor>svg{position:absolute;inset:0;width:100%;height:100%}
.halo{inset:-36%!important;width:auto!important;height:auto!important;border-radius:50%;will-change:opacity;
  background:radial-gradient(circle,rgba(255,181,71,.30) 0%,rgba(255,181,71,.13) 30%,rgba(255,140,40,.05) 50%,transparent 69%);animation:breathe 7s ease-in-out infinite alternate}
.halo.hot{background:radial-gradient(circle,rgba(255,106,26,.44) 0%,rgba(255,80,20,.16) 33%,transparent 66%);opacity:0;animation:none;transition:opacity 2.4s}
body.forge .halo.hot{opacity:1}
@keyframes breathe{from{opacity:.55}to{opacity:1}}
.spin{position:absolute;inset:0;will-change:transform}
.spin>svg{position:absolute;inset:0;width:100%;height:100%}
.r-ticks{animation:rot 150s linear infinite}
.r-seg{animation:rot 54s linear infinite reverse}
.r-dash{animation:rot 26s linear infinite}
.r-sweep{animation:rot 6.5s linear infinite}
.r-sec{animation:rot 60s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.spinup{will-change:transform}
.sweep{position:absolute;inset:6%;border-radius:50%;transition:opacity 2.4s;
  background:conic-gradient(from 0deg,transparent 0deg 300deg,rgba(255,181,71,.0) 300deg,rgba(255,181,71,.1) 352deg,rgba(255,233,176,.38) 359.5deg,transparent 360deg)}
.sweep.hot{opacity:0;background:conic-gradient(from 0deg,transparent 0deg 296deg,rgba(255,106,26,0) 296deg,rgba(255,106,26,.16) 352deg,rgba(255,200,120,.5) 359.5deg,transparent 360deg)}
body.forge .sweep.hot{opacity:1}body.forge .sweep.cool{opacity:0}
.core{inset:19%!important;width:auto!important;height:auto!important;border-radius:50%;
  background:radial-gradient(circle at 50% 36%,#2A1B10 0%,#170E09 50%,#0B0706 100%);
  box-shadow:0 0 0 1px rgba(255,181,71,.45),0 0 calc(var(--R)*.14) rgba(255,181,71,.2),inset 0 0 calc(var(--R)*.16) rgba(255,181,71,.15)}
.pulse{inset:17.4%!important;width:auto!important;height:auto!important;border-radius:50%;will-change:opacity;
  box-shadow:0 0 0 1.5px rgba(255,233,176,.6),0 0 16px rgba(255,181,71,.55);animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.12}50%{opacity:.8}}
.r-sec i{position:absolute;left:50%;top:17.4%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:radial-gradient(circle,#FFF8E6 0 26%,rgba(255,181,71,.9) 42%,transparent 72%)}
.clock{inset:19%!important;width:auto!important;height:auto!important;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:50%;z-index:2}
.time{font-family:var(--word);font-size:calc(var(--R)*.5);line-height:.86;letter-spacing:.01em;white-space:nowrap;
  color:#FFE2A0;text-shadow:0 0 calc(var(--R)*.07) rgba(255,181,71,.55),0 0 calc(var(--R)*.2) rgba(255,140,40,.25)}
.date{font-family:var(--disp);font-weight:600;font-size:calc(var(--R)*.074);letter-spacing:.26em;color:var(--gold);opacity:.88;margin-top:calc(var(--R)*.07);padding-left:.26em;white-space:nowrap}

/* ---- the add-ons, his picks 10-28 (on since his "put it on" that night): power and air beside the clock, the day orbit,
        the hour flare, the kitchen timer, holiday colors. None has a layer of its own at rest: the tablet's GPU blends
        every layer every frame, and each extra one cost ~25 late frames in 500 (measured 10-29). The bead is drawn into
        the static outer ring, the brackets and the timer into the core; the flare and the spark get a layer only while
        they play ---- */
.flare{inset:-14%!important;width:auto!important;height:auto!important;border-radius:50%;opacity:0;visibility:hidden;pointer-events:none;
  background:radial-gradient(circle,rgba(255,241,204,.5) 0%,rgba(255,181,71,.3) 26%,rgba(255,140,40,.1) 48%,transparent 68%)}
.core>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.g-lab,#tm-txt{font-family:var(--mono);font-weight:500;letter-spacing:.5px}
.g-lab{font-size:6.4px}
#tm-txt{font-size:7.4px;fill:#FFC46B}
#tmr{display:none}
#tmr.on{display:block}
#tmr.done{animation:tblink 1.1s ease-in-out infinite}
@keyframes tblink{0%,100%{opacity:1}50%{opacity:.3}}
#chg{visibility:hidden;pointer-events:none}
#chg i{position:absolute;left:50%;top:22.5%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle,#FFFDF5 0 24%,rgba(255,200,90,.95) 44%,transparent 72%)}
#clock.down{opacity:.7;transition:opacity .15s}
#sheet .tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
#sheet .left{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:#FFC46B}
/* holidays, on the day only: the gold dust and the orbit's sparks wear the day's colors */
body[data-hol] .mote:nth-child(3n+1){background:radial-gradient(circle,rgba(var(--h1),.95) 0%,rgba(var(--h1),.5) 35%,rgba(var(--h1),0) 70%)}
body[data-hol] .mote:nth-child(3n+2){background:radial-gradient(circle,rgba(var(--h2),.95) 0%,rgba(var(--h2),.5) 35%,rgba(var(--h2),0) 70%)}
body[data-hol] .mote:nth-child(3n){background:radial-gradient(circle,rgba(var(--h3),.95) 0%,rgba(var(--h3),.5) 35%,rgba(var(--h3),0) 70%)}
body[data-hol] .runner:nth-child(1) i{background:radial-gradient(circle,#FFFFFF 0 22%,rgba(var(--h1),.9) 40%,transparent 70%)}
body[data-hol] .runner:nth-child(2) i{background:radial-gradient(circle,#FFFFFF 0 22%,rgba(var(--h2),.9) 40%,transparent 70%)}
body[data-hol] .runner:nth-child(3) i{background:radial-gradient(circle,#FFFFFF 0 22%,rgba(var(--h3),.9) 40%,transparent 70%)}
body[data-hol] .greet b{color:rgb(var(--hg))}
body[data-hol=halloween]{--h1:176,92,255;--h2:124,255,79;--h3:255,138,30;--hg:196,140,255}
body[data-hol=thanksgiving]{--h1:226,72,61;--h2:255,154,46;--h3:201,133,46;--hg:255,120,70}
body[data-hol=xmas]{--h1:255,74,74;--h2:63,208,122;--h3:255,255,255;--hg:255,96,96}
body[data-hol=newyear]{--h1:255,233,176;--h2:217,222,232;--h3:255,255,255;--hg:236,240,248}
body[data-hol=july4]{--h1:255,74,74;--h2:255,255,255;--h3:91,140,255;--hg:130,165,255}

/* ---- the orbit ---- */
#orbit{position:absolute;z-index:3;pointer-events:none}
#runners{position:absolute;z-index:3;pointer-events:none}
.runner{position:absolute;inset:0;will-change:transform,opacity}
.runner i{position:absolute;left:50%;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
  background:radial-gradient(circle,#FFF6DA 0 22%,rgba(255,181,71,.85) 40%,transparent 70%);transition:filter 2s}
body.forge .runner i{background:radial-gradient(circle,#FFF0D0 0 22%,rgba(255,106,26,.9) 42%,transparent 70%)}

/* ---- the pods ---- */
#pods{position:absolute;inset:0;z-index:4;pointer-events:none}
.pod{position:absolute;pointer-events:auto;cursor:pointer;outline:none;transition:transform .14s ease,opacity 1.2s ease}
/* a remote (the Fire TV Stick, 10-29): the arrows move a gold ring, the cursor (.cur); a keyboard's focus wears the same; a finger never sees either */
.pod:focus-visible::after,.pod.cur::after{content:'';position:absolute;inset:-9%;border-radius:50%;box-shadow:0 0 0 3px var(--gold-hot),0 0 28px rgba(255,181,71,.75);pointer-events:none}
#gear:focus-visible,#sheet button:focus-visible,#gear.cur,.chip.cur,#sheet .cur,.ch.cur,.nw.cur{outline:2px solid var(--gold-hot);outline-offset:4px}
.ch.cur{outline-offset:1px}
#clock.cur .time{text-shadow:0 0 14px var(--gold-hot),0 0 44px var(--gold)}
.tv *:focus{outline:none}
/* the stick's layer diet (10-29, measured: every composited layer costs its chip per frame; 63 layers = 1.9 cores): on a TV the 1-px
   scan line, the three orbit runners and 8 of the 14 motes stay out; the rings, the orbs, the glows and the clock keep moving */
.tv #scan,.tv .runner,.tv .mote:nth-child(n+7){display:none}
/* the stick's WebView draws the core's SVG text out of place after the clock's minute update (the power and air labels jumped
   into the name line; measured 10-29: the layout boxes are right, the drawing is not; any restyle only hides it until the next
   minute). On a TV that text becomes one HTML line under the date: the timer while it runs, else the air. The power bracket
   goes too: a TV stick is always on power at 100% */
#tvline{display:none}
body.tv #tvline{display:block;color:var(--dim);font-size:calc(var(--R)*.062);letter-spacing:.22em;margin-top:calc(var(--R)*.05)}
body.tv #tvline b{font-weight:600;color:var(--gold-hot)}
body.tv .g-lab,body.tv #tm-txt,body.tv #bolt{display:none}
/* a video in the tile: the floating sparks step out (measured 10-29 on the stick: 16 late video frames in 208 with them, 0 without) */
body.yt-on #motes,body.yt-on #embers{display:none}
/* ---- the TV layout (Hector 10-29: "the streaming platforms around the clock", the weather smaller, YouTube under it, the news) ----
   Only with the app's `tv`; the tablet's layout is untouched. 1443x812 CSS px on the stick. */
#apps,#tvcol,#appname{display:none}
body.tv #apps{display:block;position:absolute;inset:0;pointer-events:none;z-index:4}
.tapp{position:absolute;pointer-events:auto;border-radius:50%;overflow:hidden;background:#100A07;box-shadow:0 0 0 1.5px rgba(255,181,71,.42),0 0 14px rgba(255,181,71,.16);transition:transform .14s ease}
.tapp img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.45) brightness(.72)}
.tapp.cur{transform:scale(1.16);box-shadow:0 0 0 3px var(--gold-hot),0 0 28px rgba(255,181,71,.75)}
.tapp.cur img{filter:none}
body.tv-app #date{display:none}
body.tv-app #appname{display:block;color:var(--gold-hot)}
body.boot #apps{opacity:0}
body.tv.land #bottom{left:var(--tvL);right:24px;width:auto;top:104px;bottom:14px}
body.tv.land #hours{flex-direction:row;gap:0;margin-bottom:12px}
body.tv.land .h{display:block;text-align:center}
body.tv.land .h svg{width:20px;height:20px;margin:4px auto 2px}
body.tv.land .h b{text-align:center;font-size:18px}
body.tv.land .h i{display:none}
body.tv #tvcol{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
#yt-scr{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#0B0705;border:1px solid rgba(255,181,71,.26)}
#yt-scr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#yt-idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center}
#yt-idle b{font-family:var(--word);font-weight:400;font-size:28px;letter-spacing:.14em;color:var(--gold-hot)}
#yt-idle span{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim)}
#yt-ch{display:flex;gap:8px;margin-top:5px;padding:4px;overflow:hidden}
.ch{flex:none;padding:7px 11px;border-radius:6px;border:1px solid rgba(255,181,71,.28);background:none;font:500 10.5px var(--mono);letter-spacing:.14em;color:var(--dim);white-space:nowrap}
.ch.on{color:var(--gold-hot);border-color:var(--gold)}
.ch.on::before{content:'■ '}
body.tv #yt-scr.cur{outline:2px solid var(--gold-hot);outline-offset:3px}
/* the stick: Amazon's WebView puts the video in its own layer under the page and cuts a hole for it, and it cannot cut a
   rounded one: a rounded clip turned every channel black in the tile, full screen (square) played (measured 10-29) */
body.tv #yt-scr{border-radius:0}
#yt-scr.cur::after{content:'SELECT: FULL SCREEN · BACK: STOP';position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:2;padding:5px 10px;border-radius:5px;background:rgba(11,7,5,.84);font:500 10px var(--mono);letter-spacing:.18em;color:var(--gold-hot);white-space:nowrap;pointer-events:none}
#news{flex:1;min-height:0;display:flex;flex-direction:column}
.nh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.nh b{font-family:var(--word);font-weight:400;font-size:20px;letter-spacing:.16em;color:var(--gold)}
.nh span{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--faint)}
#news-l{flex:1;min-height:0;overflow:hidden}
.nw{display:block;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--ink)}
.nw small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--gold);margin-bottom:3px}
.nw span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.3}
.nw[hidden]{display:none}
.nw.cur{background:rgba(255,181,71,.08)}
body.tv #yt.full{position:fixed;inset:0;z-index:80;background:#000}
body.tv #yt.full #yt-scr{position:absolute;inset:0;aspect-ratio:auto;border:0;border-radius:0;outline:none}
#yt.full #yt-scr::after{display:none}
body.tv #yt.full #yt-ch{display:none}
body.yt-full #reactor,body.yt-full #pods,body.yt-full #apps,body.yt-full #orbit,body.yt-full #motes,body.yt-full #embers,body.yt-full #top,body.yt-full .label{visibility:hidden}
/* a video in the tile or full screen: the room holds still (measured 10-29: FOX in the tile beside the moving HUB = 47 doubled
   frames in 372 on the stick); the clock keeps its minutes */
body.yt-on .spin,body.yt-on .orb,body.yt-on .glow,body.yt-on .halo,body.yt-on .pulse,body.yt-on .fg,body.yt-on .pt{animation-play-state:paused}
.pod>span{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.pod .glow{inset:-48%;background:radial-gradient(circle,rgba(255,181,71,.3) 0%,rgba(255,181,71,.08) 38%,transparent 64%);will-change:opacity;animation:breathe 4.6s ease-in-out infinite alternate}
.pod .orb{inset:-15%;will-change:transform;animation:rot 28s linear infinite}
.pod .orb::before{content:'';position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(255,181,71,.38)}
.pod .orb::after{content:'';position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:radial-gradient(circle,#FFF6DA 0 25%,rgba(255,181,71,.8) 45%,transparent 72%)}
.pod .ring{box-shadow:0 0 0 1.6px rgba(255,190,90,.9),0 0 18px rgba(255,181,71,.38),inset 0 0 16px rgba(255,181,71,.26)}
.pod .face{inset:5px;background:radial-gradient(circle at 50% 30%,#2B1D12 0%,#150E0A 55%,#0A0708 100%);overflow:hidden}
.pod .face::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(180deg,rgba(255,233,176,.12),transparent 42%)}
.pod .icon{inset:27%;color:var(--gold-hot);filter:none}
.pod .icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pod .meter{inset:-7%;opacity:0;transition:opacity 1.2s}
.pod .meter svg{width:100%;height:100%;transform:rotate(-90deg)}
.pod .meter circle{fill:none;stroke-width:3.2;stroke-linecap:round}
.pod.down{transform:scale(.92)}
.pod:nth-child(2) .orb{animation-duration:34s;animation-direction:reverse}
.pod:nth-child(3) .orb{animation-duration:23s}
.pod:nth-child(2) .glow{animation-delay:-1.6s}.pod:nth-child(3) .glow{animation-delay:-3.1s}
.pod.off{opacity:.36}
.pod.off .glow,.pod.off .orb{animation:none}
.pod.hot .ring{box-shadow:0 0 0 1.6px rgba(255,120,40,.95),0 0 22px rgba(255,96,20,.6),inset 0 0 18px rgba(255,96,20,.4)}
.pod.hot .face{background:radial-gradient(circle at 50% 108%,#C2410C 0%,#5A1A07 34%,#1A0B06 64%,#0A0708 100%)}
.pod.hot .icon{color:#FFD9A0}
.pod.hot .glow{background:radial-gradient(circle,rgba(255,96,20,.42) 0%,rgba(255,96,20,.12) 38%,transparent 64%);animation-duration:2.2s}
.pod.hot .orb::before{border-color:rgba(255,120,40,.5)}
.pod.hot .meter{opacity:1}
.label{position:absolute;z-index:4;text-align:center;pointer-events:none;transition:opacity 1.2s ease}
.label b{display:block;font-family:var(--word);font-weight:400;font-size:clamp(20px,calc(var(--R)*.135),30px);letter-spacing:.14em;padding-left:.14em;color:var(--ink);line-height:1}
.label b.long{font-size:clamp(17px,calc(var(--R)*.105),24px);letter-spacing:.1em}
.label span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dim);margin-top:5px;white-space:nowrap}
.label span.l2{margin-top:3px;color:#FFD9A0}
.label em{font-style:normal}.label .ok{color:var(--gold)}.label .bad{color:var(--red)}.label .hot{color:#FFB36B}
.label b,.label span{width:fit-content;margin-left:auto;margin-right:auto}
.label.side{text-align:left}.label.side b,.label.side span{margin-left:0}
.chip{display:inline-block;pointer-events:auto;margin-top:6px;padding:4px 9px 3px;border:1px solid rgba(255,181,71,.55);border-radius:4px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--gold);background:rgba(255,181,71,.07);cursor:pointer}
.chip:active{background:rgba(255,181,71,.2)}

/* ---- top and bottom ---- */
#top{position:absolute;left:24px;right:24px;top:22px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;transition:opacity 1.2s ease}
.greet b{display:block;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.24em;color:var(--gold);white-space:nowrap}
.greet span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim);margin-top:7px;white-space:nowrap}
.wx{display:flex;align-items:center;gap:10px;text-align:right}
.wx svg{width:34px;height:34px;fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.wx b{display:block;font-family:var(--word);font-weight:400;font-size:42px;line-height:.9;color:var(--gold-hot)}
.wx span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);margin-top:3px;white-space:nowrap}
#bottom{position:absolute;left:22px;right:22px;bottom:16px;height:126px;display:flex;flex-direction:column;justify-content:flex-end;z-index:5;transition:opacity 1.2s ease}
#bottom::before{content:'';display:block;height:1px;margin-bottom:12px;background:linear-gradient(90deg,transparent,rgba(255,181,71,.35) 18%,rgba(255,181,71,.35) 82%,transparent)}
#hours{display:flex;justify-content:space-between}
.h{flex:1;text-align:center}
.h span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--dim)}
.h svg{width:24px;height:24px;margin:6px auto 4px;display:block;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.h b{display:block;font-family:var(--word);font-weight:400;font-size:21px;color:var(--ink);letter-spacing:.04em}
.h i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:#8FB8FF;letter-spacing:.06em;height:12px}
#cook{display:none}
body.forge #cook{display:block}body.forge #hours{display:none}
.ck1{display:flex;justify-content:space-between;align-items:baseline}
.ck1 b{font-family:var(--word);font-weight:400;font-size:24px;letter-spacing:.12em;color:#FFD9A0}
.ck1 b::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember);margin-right:10px;vertical-align:4px;animation:pulse 1.6s ease-in-out infinite}
.ck1 span{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#FFB36B}
.ck2{display:flex;gap:18px;margin-top:8px}
.ck2 div{flex:1}
.ck2 small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--dim)}
.ck2 em{display:block;font-style:normal;font-family:var(--word);font-size:30px;line-height:1;color:var(--ink);letter-spacing:.03em}
.ck2 em u{text-decoration:none;font-size:18px;color:var(--dim)}
.bar{height:4px;margin-top:9px;border-radius:2px;background:rgba(255,181,71,.13);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#B83A08,var(--ember),#FFD27A);transition:width 1.2s ease}
#foot{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--faint)}
#net::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--go);margin-right:8px;vertical-align:1px;box-shadow:0 0 6px var(--go)}
#net.off::before{background:var(--red);box-shadow:0 0 6px var(--red)}
#gear{display:none;width:36px;height:36px;margin:-12px -8px -12px 0;border:0;background:none;color:var(--dim);cursor:pointer}
#gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
body.app #gear{display:block}

/* ---- landscape: the reactor left, the pods to its right, the day in a column ---- */
body.land #top{right:auto;width:calc(var(--colL) - 24px)}
body.land .wx{position:fixed;right:24px;top:22px}
body.land #bottom{left:auto;right:22px;width:var(--colW);top:116px;bottom:16px;height:auto}
body.land #bottom::before{display:none}
body.land #hours{flex-direction:column;gap:8px;margin-bottom:auto}
body.land .h{display:grid;grid-template-columns:52px 28px 1fr 40px;align-items:center;text-align:left}
body.land .h svg{margin:0}
body.land .h b{text-align:right}
body.land .h i{text-align:right;height:auto}

/* ---- the iris between the HUB and a service ---- */
#iris{position:fixed;left:0;top:0;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;pointer-events:none;opacity:0;z-index:40;will-change:transform,opacity;
  background:radial-gradient(circle,#0A0708 0 51%,#24150B 58%,rgba(255,181,71,.9) 65.5%,#FFF1CC 67%,rgba(255,181,71,.55) 69%,transparent 73%)}

/* ---- boot ---- */
#boot{position:fixed;inset:0;z-index:30;pointer-events:none}
#boot .line{position:absolute;left:12%;right:12%;height:1.5px;transform:scaleX(0);background:linear-gradient(90deg,transparent,var(--gold) 20%,#FFF1CC 50%,var(--gold) 80%,transparent);box-shadow:0 0 12px rgba(255,181,71,.6);transition:transform .55s cubic-bezier(.3,.9,.3,1),opacity .5s}
#boot pre{position:absolute;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11.5px;line-height:1.9;letter-spacing:.14em;color:var(--gold);transition:opacity .45s}
#boot pre em{font-style:normal;color:var(--dim)}#boot pre .ok{color:var(--go)}#boot pre .bad{color:var(--red)}#boot pre .wait{color:var(--faint)}
body.boot #reactor{opacity:0;transform:scale(.62)}
body.boot #pods .pod,body.boot .label{opacity:0;transform:scale(.4)}
body.boot #top,body.boot #bottom,body.boot #orbit,body.boot #runners{opacity:0}
#orbit,#runners{transition:opacity 1.2s ease}
body.boot .pod,body.boot .label,body.landing .pod,body.landing .label{transition:transform .55s cubic-bezier(.2,1.5,.4,1),opacity .4s ease}

/* ---- night: the screen dims to the reactor and the clock ---- */
body.dim #top,body.dim #bottom,body.dim #runners,body.dim #orbit,body.dim .label,body.dim .pod{opacity:.14;transition-duration:2.4s}
body.dim.forge .pod.hot,body.dim.forge #bottom{opacity:.55}
body.dim .halo{animation-duration:14s}
body.dim #scan,body.dim #motes{display:none}

/* ---- the link sheet ---- */
#sheet{position:fixed;left:0;right:0;top:0;z-index:60;padding:26px 24px 22px;background:rgba(14,9,7,.97);border-bottom:1px solid rgba(255,181,71,.4);box-shadow:0 18px 60px rgba(0,0,0,.8);touch-action:auto}
#sheet[hidden]{display:none}
#sheet h2{font-family:var(--word);font-weight:400;font-size:28px;letter-spacing:.12em;color:var(--gold-hot)}
#sheet p{font-size:14px;line-height:1.5;color:var(--dim);margin-top:8px}
#sheet input{display:block;width:100%;height:52px;margin-top:12px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,181,71,.35);background:#140D0A;color:var(--ink);font:500 17px var(--disp);user-select:text;-webkit-user-select:text}
#sheet input:focus{outline:none;border-color:var(--gold)}
#sheet .row{display:flex;gap:10px;margin-top:16px}
#sheet button{flex:1;height:52px;border-radius:8px;border:1px solid rgba(255,181,71,.5);background:#1C130D;color:var(--ink);font:600 15px var(--disp);letter-spacing:.16em}
#sheet button.go{background:var(--gold);border-color:var(--gold);color:#140C06}
#sheet .err{color:#FF8A80;min-height:20px}
#toast{position:fixed;left:50%;top:18px;z-index:70;transform:translate(-50%,-220%);opacity:0;padding:11px 18px;border-radius:6px;background:rgba(20,13,9,.96);border:1px solid rgba(255,181,71,.5);font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--gold-hot);white-space:nowrap;transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .25s;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
/* a browser asking for less motion gets a still reactor. Not the tablet's app: its "reduce motion" is only Android's
   own animations switched off for speed (10-28), and the HUB's motion is the point (Hector: "make it look the best possible") */
@media (prefers-reduced-motion:reduce){body:not(.app) .spin,body:not(.app) .halo,body:not(.app) .pulse,body:not(.app) .pod .orb,body:not(.app) .pod .glow{animation:none!important}}
</style>

<script>
(() => {
'use strict';
const APP = window.HubsApp || null;          // the Hubs app on the desk tablet; absent in a browser
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') || '';
const doc = document, body = doc.body, $ = id => doc.getElementById(id);
const MIN = 60e3;
const PLACE = { lat: 34.3917, lon: -118.5426, name: 'SANTA CLARITA' };   // the point the Lounge's weather uses
const DEFAULTS = [
  { name: 'Lounge', url: 'https://hectorfsv.github.io/lounge/', mic: true },
  { name: 'The Pit', url: 'https://hectorfsv.github.io/the-pit/', mic: false },
  { name: 'Home Assistant', url: '', mic: false },
];
const S = { svc: [], reach: {}, wx: null, cook: null, pit: 'none', idleAt: Date.now(), dimmed: false, swallow: 0, sheet: null, launching: false, geo: null, booted: false };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private window */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* same */ } },
};
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function fetchT(url, ms, opts) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  return fetch(url, Object.assign({ signal: c.signal }, opts)).finally(() => clearTimeout(t));
}
function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms || 2600);
}

// ---- the services: the app's Setup decides them; a browser gets the defaults ----
function loadServices() {
  let list = null;
  if (APP) try { const j = JSON.parse(APP.services()); list = j.services; S.version = j.version; S.tv = !!j.tv; } catch (e) { /* defaults */ }
  body.classList.toggle('tv', !!S.tv);
  S.svc = [0, 1, 2].map(i => {
    const s = (list && list[i]) || (list ? { name: DEFAULTS[i].name, url: '' } : DEFAULTS[i]);
    return { i, name: String(s.name || DEFAULTS[i].name), url: String(s.url || ''), mic: !!s.mic };
  });
  S.pitIx = S.svc.findIndex(s => /\/the-pit(\/|$)/.test(s.url));
  $('ver').textContent = 'HUB' + (S.version ? ' · APP ' + S.version : '');
}

// ---- drawing: the rings once, as SVG; only their layers turn ----
const P = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [(r * Math.cos(a)).toFixed(2), (r * Math.sin(a)).toFixed(2)]; };
function drawRings() {
  let minor = '', major = '';
  for (let a = 0; a < 360; a += 3) {
    const big = a % 15 === 0, [x1, y1] = P(big ? 81.5 : 84.5, a), [x2, y2] = P(90, a);
    if (big) major += `M${x1} ${y1}L${x2} ${y2}`; else minor += `M${x1} ${y1}L${x2} ${y2}`;
  }
  let tri = '';
  for (const a of [0, 90, 180, 270]) { const [x, y] = P(93, a), [lx, ly] = P(97.5, a - 2.4), [rx, ry] = P(97.5, a + 2.4); tri += `M${x} ${y}L${lx} ${ly}L${rx} ${ry}Z`; }
  $('ring-ticks').innerHTML = `<path d="${minor}" stroke="#FFB547" stroke-width=".55" opacity=".5"/><path d="${major}" stroke="#FFD27A" stroke-width="1.1" opacity=".9"/><path d="${tri}" fill="#FFB547" opacity=".85"/>`;
  const c = 2 * Math.PI * 76, arc = c * 84 / 360, gap = c * 36 / 360;
  $('ring-seg').innerHTML = `<defs><linearGradient id="sg" x1="0" y1="-1" x2="0" y2="1"><stop offset="0" stop-color="#FFF1CC"/><stop offset=".5" stop-color="#FFB547"/><stop offset="1" stop-color="#B8741A"/></linearGradient></defs>`
    + `<circle r="71" fill="none" stroke="#FFB547" stroke-width=".4" opacity=".4"/><circle r="81" fill="none" stroke="#FFB547" stroke-width=".4" opacity=".3"/>`
    + `<circle r="76" fill="none" stroke="url(#sg)" stroke-width="5" stroke-dasharray="${arc.toFixed(2)} ${gap.toFixed(2)}" transform="rotate(-132)" opacity=".95"/>`
    + `<circle r="76" fill="none" stroke="#FFF1CC" stroke-width=".8" stroke-dasharray="${(arc * .18).toFixed(2)} ${(arc * .82 + gap).toFixed(2)}" transform="rotate(-132)" opacity=".9"/>`;
  let notch = '';
  for (const a of [45, 135, 225, 315]) { const [x1, y1] = P(93.5, a), [x2, y2] = P(101, a); notch += `M${x1} ${y1}L${x2} ${y2}`; }
  $('ring-static').innerHTML = `<circle r="99" fill="none" stroke="#FFB547" stroke-width=".5" opacity=".45"/><circle r="95.5" fill="none" stroke="#FFB547" stroke-width=".35" opacity=".22"/><path d="${notch}" stroke="#FFD27A" stroke-width="1.2" opacity=".7"/>`;
}

const ICON = {
  voice: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17.5" opacity=".42"/><path d="M15 21v6M19.5 16.5v15M24 12v24M28.5 16.5v15M33 21v6"/></svg>',
  flame: '<svg viewBox="0 0 48 48"><path d="M24 5.5c1.8 6.6 10.5 10.5 10.5 21.5 0 7.6-4.8 13.5-10.5 13.5S13.5 34.6 13.5 28c0-5.4 3-9.4 6-11.6 0 4.6 1.6 7.4 4.3 8.6C22 19.4 22.4 12.2 24 5.5z"/><path d="M24 40.5c-3 0-5.2-2.4-5.2-5.4 0-2.8 1.7-4.6 3.3-5.7.3 2.3 1.4 3.5 3 4-.3-1.8.4-3.9 1.6-5.4 1.7 2 2.5 4.2 2.5 6.9 0 3.4-2.1 5.6-5.2 5.6z" opacity=".75"/></svg>',
  home: '<svg viewBox="0 0 48 48"><path d="M8 23 24 10l16 13M13 19.5V38h22V19.5M21 38v-9h6v9"/></svg>',
};
const WXI = {
  sun: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.4 5.4 7 7M17 17l1.6 1.6M5.4 18.6 7 17M17 7l1.6-1.6"/>',
  moon: '<path d="M19.6 14.8A8.2 8.2 0 0 1 9.2 4.4a8.2 8.2 0 1 0 10.4 10.4z"/>',
  cloud: '<path d="M7 18.6h10.4a4.2 4.2 0 0 0 .3-8.4 6 6 0 0 0-11.6 1.7A3.4 3.4 0 0 0 7 18.6z"/>',
  pday: '<path d="M8.2 3.2v1.6M3 8.4h1.6M4.5 4.7l1.1 1.1M11.9 4.7l-1.1 1.1"/><path d="M5.4 10.6a3.3 3.3 0 0 1 6-2.6"/><path d="M8.6 19.6h9.2a3.7 3.7 0 0 0 .3-7.4 5.3 5.3 0 0 0-10.2 1.5 3 3 0 0 0 .7 5.9z"/>',
  pnight: '<path d="M11.2 6.2A4.6 4.6 0 0 1 5 2.4a4.7 4.7 0 1 0 6.2 3.8z" transform="translate(1 2)"/><path d="M8.6 19.6h9.2a3.7 3.7 0 0 0 .3-7.4 5.3 5.3 0 0 0-10.2 1.5 3 3 0 0 0 .7 5.9z"/>',
  fog: '<path d="M4 9h16M6 13h12M4 17h16"/>',
  rain: '<path d="M7 15.4h10.4a4 4 0 0 0 .3-8 5.8 5.8 0 0 0-11.2 1.6A3.2 3.2 0 0 0 7 15.4z"/><path d="M8.5 18l-1 2.6M12.5 18l-1 2.6M16.5 18l-1 2.6"/>',
  snow: '<path d="M7 15.4h10.4a4 4 0 0 0 .3-8 5.8 5.8 0 0 0-11.2 1.6A3.2 3.2 0 0 0 7 15.4z"/><path d="M8.5 19h.01M12 20.5h.01M15.5 19h.01" stroke-width="2.4"/>',
  storm: '<path d="M7 15.4h10.4a4 4 0 0 0 .3-8 5.8 5.8 0 0 0-11.2 1.6A3.2 3.2 0 0 0 7 15.4z"/><path d="M12.6 15.6 10.4 19h3.2l-2 3.4"/>',
};
const wxSvg = (k, cls) => `<svg viewBox="0 0 24 24"${cls ? ` class="${cls}"` : ''}>${WXI[k] || WXI.cloud}</svg>`;
function wxKind(code, day) {
  if (code <= 1) return day ? 'sun' : 'moon';
  if (code === 2) return day ? 'pday' : 'pnight';
  if (code === 3) return 'cloud';
  if (code <= 48) return 'fog';
  if (code <= 67 || (code >= 80 && code <= 82)) return 'rain';
  if (code <= 77 || code === 85 || code === 86) return 'snow';
  return 'storm';
}
function wxLabel(c) {
  return c === 0 ? 'CLEAR' : c === 1 ? 'MOSTLY CLEAR' : c === 2 ? 'PARTLY CLOUDY' : c === 3 ? 'OVERCAST' : c <= 48 ? 'FOG' : c <= 57 ? 'DRIZZLE'

// ---- layout: portrait (the tablet), landscape, any phone or desktop ----
function layout(force) {
  const W = innerWidth, H = innerHeight;
  if (S.sheet && !force && S.geo && S.geo.W === W) return;   // the keyboard is up for the sheet: keep everything still
  const land = W > H * 1.1;
  body.classList.toggle('land', land);
  let R, cx, cy, Ro, rp, ang, labelSide, Ra = 0, ra = 0;
  if (!land) {
    const topH = 92, botH = 16 + 126, labelH = 74;
    R = Math.min(W * .36, (H - topH - 12 - 12 - labelH - 10 - botH) / 2.77, 250);
    Ro = R * 1.48; rp = R * .29;
    cx = W / 2;
    const lo = topH + 12 + R, hi = H - botH - 10 - labelH - 12 - rp - Ro;
    cy = hi > lo ? (lo + hi) / 2 : lo;
    ang = [130, 90, 50]; labelSide = false;
  } else if (S.tv) {   // a TV: the apps ring around the clock, the pods beyond it, YouTube and the news in a column on the right
    R = Math.min(H * .245, 200);
    Ro = R * 1.66; rp = R * .28; Ra = R * 1.24; ra = R * .135;
    cx = Ra + ra + 34; cy = H / 2 + 14;
    ang = [-40, 0, 40]; labelSide = true;
  } else {
    R = Math.min(H * .32, W * .2, 240);
    Ro = R * 1.38; rp = R * .28;
    cx = Math.max(R * 1.05, W * .2); cy = H / 2 + 8;
    ang = [-42, 0, 42]; labelSide = true;
  }
  S.geo = { W, H, R, cx, cy, Ro, rp, land, Ra, ra };
  const st = doc.documentElement.style;
  st.setProperty('--R', R.toFixed(1) + 'px'); st.setProperty('--rp', rp.toFixed(1) + 'px');
  st.setProperty('--bgY', (cy / H * 100).toFixed(1) + '%');
  if (land) { st.setProperty('--colL', (cx + R * .9) + 'px'); st.setProperty('--colW', Math.max(170, W - (cx + Ro + rp + 200)) + 'px'); }
  if (land && S.tv) st.setProperty('--tvL', (cx + Ro + rp + 16 + 210 + 18).toFixed(1) + 'px');
  const r = $('reactor'); Object.assign(r.style, { left: cx - R + 'px', top: cy - R + 'px', width: 2 * R + 'px', height: 2 * R + 'px' });
  const o = $('orbit'); Object.assign(o.style, { left: cx - Ro + 'px', top: cy - Ro + 'px', width: 2 * Ro + 'px', height: 2 * Ro + 'px' });
  o.setAttribute('viewBox', `${-Ro} ${-Ro} ${2 * Ro} ${2 * Ro}`);
  $('orbit-c').setAttribute('r', Ro.toFixed(1));
  const g = $('og'); if (land) { g.setAttribute('x1', 0); g.setAttribute('y1', 0); g.setAttribute('x2', 1); g.setAttribute('y2', 0); } else { g.setAttribute('x1', 0); g.setAttribute('y1', 0); g.setAttribute('x2', 0); g.setAttribute('y2', 1); }
  const rn = $('runners'); Object.assign(rn.style, { left: cx - Ro + 'px', top: cy - Ro + 'px', width: 2 * Ro + 'px', height: 2 * Ro + 'px' });
  S.geo.pods = ang.map(a => ({ x: cx + Ro * Math.cos(a * Math.PI / 180), y: cy + Ro * Math.sin(a * Math.PI / 180) }));
  doc.querySelectorAll('.pod').forEach((p, i) => {
    const c = S.geo.pods[i];
    Object.assign(p.style, { left: c.x - rp + 'px', top: c.y - rp + 'px', width: 2 * rp + 'px', height: 2 * rp + 'px' });
    const l = $('label' + i); l.classList.toggle('side', labelSide);
    if (labelSide) Object.assign(l.style, { left: c.x + rp + 16 + 'px', top: c.y - 26 + 'px', width: '210px', transformOrigin: '0 50%' });
    else Object.assign(l.style, { left: c.x - 110 + 'px', top: c.y + rp + 12 + 'px', width: '220px', transformOrigin: '50% 0' });
  });
  runners(); fitLabels(); renderDay(); placeApps(); if (typeof fitNews === 'function') fitNews();
  const bl = $('boot-line'), lg = $('boot-log');   // gone once the boot is over
  if (bl) bl.style.top = cy + 'px';
  if (lg) lg.style.top = (land ? cy - 70 : cy + R * .25) + 'px';
}
// a long name near an edge slides inward rather than off the screen
function fitLabels() {
  if (!S.geo) return;
  const W = innerWidth, edge = 10;
  doc.querySelectorAll('.label').forEach((l, i) => {
    const c = S.geo.pods[i]; if (!c) return;
    const w = Math.max(0, ...[...l.children].map(e => e.offsetWidth));
    if (S.geo.land) { const left = Math.min(c.x + S.geo.rp + 16, W - edge - w); l.style.left = left + 'px'; return; }
    const mid = clamp(c.x, edge + w / 2, W - edge - w / 2); l.style.left = mid - 110 + 'px';

// energy on the orbit: each runner circles the reactor and shows only along the arc that holds the pods
function runners() {
  const box = $('runners'); box.innerHTML = '';
  const land = S.geo.land;
  // rotation 0deg = the top of the orbit; the pods sit near 180deg (portrait) or 90deg (landscape)
  [[11000, 1, 0], [17000, -1, .45], [26000, 1, .7]].forEach(([ms, dir, ph]) => {
    const d = doc.createElement('div'); d.className = 'runner'; d.innerHTML = '<i></i>'; box.appendChild(d);
    const c = land ? (dir > 0 ? .25 : .75) : .5, w = .17;
    const frames = [0, c - w - .05, c - w, c + w, c + w + .05, 1].map((off, k) => ({ offset: off, opacity: [0, 0, 1, 1, 0, 0][k], transform: `rotate(${dir * off * 360}deg)` }));
    d.animate(frames, { duration: ms, iterations: Infinity, delay: -ph * ms, easing: 'linear' });

}

// tap = act; a hold (0.7 s) = the second action, and the tap after it is swallowed
function press(el, tap, hold) {
  let t = null, held = false, x = 0, y = 0;
  el.addEventListener('pointerdown', e => {
    if (Date.now() < S.swallow) return;
    held = false; x = e.clientX; y = e.clientY; el.classList.add('down');
    if (hold) t = setTimeout(() => { held = true; el.classList.remove('down'); hold(); }, 700);
  });
  const end = () => { clearTimeout(t); el.classList.remove('down'); };
  el.addEventListener('pointermove', e => { if (Math.hypot(e.clientX - x, e.clientY - y) > 18) end(); });
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', end);
  el.addEventListener('pointerup', end);
  el.addEventListener('click', e => { e.preventDefault(); if (held || Date.now() < S.swallow) { held = false; return; } tap(); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } });
  el.addEventListener('contextmenu', e => e.preventDefault());
}

const deg = v => v == null ? '—' : Math.round(v) + '°';

// ---- going into a service: the iris opens from the pod; coming back it closes onto it ----
function irisScale(c) {
  const W = innerWidth, H = innerHeight;
  const far = Math.max(Math.hypot(c.x, c.y), Math.hypot(W - c.x, c.y), Math.hypot(c.x, H - c.y), Math.hypot(W - c.x, H - c.y));

}
function irisAt(c) { const e = $('iris'); e.style.left = c.x + 'px'; e.style.top = c.y + 'px'; return e; }
function launch(i) {
  const s = S.svc[i];
  if (!s || !s.url) { toast((s ? s.name.toUpperCase() : 'THAT') + ' IS NOT SET UP YET'); return; }
  if (S.launching) return;
  S.launching = true; wake();
  const c = S.geo.pods[i], { s0, s1 } = irisScale(c), e = irisAt(c);
  e.getAnimations().forEach(a => a.cancel());

    S.launching = false;
    if (!doc.hidden) e.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
  }, 2200);
}

  const c = S.geo && S.geo.pods[i] || { x: innerWidth / 2, y: innerHeight / 2 }, { s0, s1 } = irisScale(c), e = irisAt(c);

// ---- the clock ----
const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'], MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

const hm = d => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
function tick() {
  const d = new Date();
  $('time').textContent = hm(d);
  $('date').textContent = `${DAYS[d.getDay()]} · ${MONTHS[d.getMonth()]} ${d.getDate()}`;
  const h = d.getHours(), hol = holiday(d);
  if (hol !== (body.dataset.hol || '')) { if (hol) body.dataset.hol = hol; else delete body.dataset.hol; if (S.booted) motes(); }
  $('greet').textContent = (hol ? HELLO[hol](d) : h < 5 ? 'LATE NIGHT' : h < 12 ? 'GOOD MORNING' : h < 17 ? 'GOOD AFTERNOON' : 'GOOD EVENING') + ', HECTOR';
  const sec = $('sec'); sec.style.animationDelay = -(d.getSeconds() + d.getMilliseconds() / 1000) + 's';
  renderSun(); if (S.cook) renderCook();
  if (S.booted) {
    if (d.getMinutes() === 0 && d.getSeconds() < 5 && !S.dimmed && !doc.hidden && S.flared !== d.toDateString() + h) { S.flared = d.toDateString() + h; hourFlare(); }
    if (!doc.hidden) { weather(false); air(false); }   // a HUB left on screen for hours keeps its weather fresh (every 15 min)
  }
  clearTimeout(tick.t); tick.t = setTimeout(tick, 60000 - d.getSeconds() * 1000 - d.getMilliseconds() + 30);
}

// ---- weather (Open-Meteo: free, no key) ----
async function weather(force) {
  if (DEMO) { S.wx = { at: Date.now(), j: demoWx() }; renderWx(); return; }
  if (!force && S.wx && Date.now() - S.wx.at < 15 * MIN) return;
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${PLACE.lat}&longitude=${PLACE.lon}`
    + '&current=temperature_2m,weather_code,is_day,wind_speed_10m,wind_gusts_10m&hourly=temperature_2m,weather_code,precipitation_probability,is_day'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FLos_Angeles&forecast_days=2';
  try {
    const r = await fetchT(u, 9000); if (!r.ok) throw new Error(r.status);
    S.wx = { at: Date.now(), j: await r.json() }; store.set('hub.wx', S.wx); S.wxErr = false;
  } catch (e) { S.wxErr = true; }
  renderWx();
}
function renderWx() {
  const w = S.wx && Date.now() - S.wx.at < 3 * 3600e3 ? S.wx.j : null, box = $('wx');
  if (!w || !w.current) { box.innerHTML = `<div><b>—</b><span>WEATHER ${S.wxErr ? 'OFFLINE' : '…'}</span></div>`; $('hours').innerHTML = ''; renderSun(); return; }
  const c = w.current, d = w.daily, gust = Math.round(c.wind_gusts_10m || 0), wind = Math.round(c.wind_speed_10m || 0);
  const windTxt = wind >= 15 || S.cook ? `WIND ${wind}${gust > wind + 8 ? '–' + gust : ''} MPH` : `H ${Math.round(d.temperature_2m_max[0])}° · L ${Math.round(d.temperature_2m_min[0])}°`;
  box.innerHTML = `<div><b>${Math.round(c.temperature_2m)}°</b><span>${wxLabel(c.weather_code)}</span><span>${windTxt}</span></div>${wxSvg(wxKind(c.weather_code, c.is_day))}`;
  const now = Date.now(), H = w.hourly; let html = '', n = 0;
  for (let k = 0; k < H.time.length && n < 6; k++) {
    const t = new Date(H.time[k]).getTime(); if (t <= now) continue;
    const hd = new Date(t), p = H.precipitation_probability ? H.precipitation_probability[k] : 0;
    html += `<div class="h"><span>${hm(hd)}</span>${wxSvg(wxKind(H.weather_code[k], H.is_day[k]))}<b>${Math.round(H.temperature_2m[k])}°</b><i>${p >= 20 ? p + '%' : ''}</i></div>`; n++;
  }
  $('hours').innerHTML = html; renderSun();
}
function sunTimes() {
  const w = S.wx && S.wx.j && S.wx.j.daily; if (!w || !w.sunrise) return null;
  return { rise: w.sunrise.map(s => new Date(s).getTime()), set: w.sunset.map(s => new Date(s).getTime()) };
}
function renderSun() {
  const s = sunTimes(), now = Date.now(), f = t => hm(new Date(t));

  if (s) txt = (now < s.rise[0] ? `SUNRISE ${f(s.rise[0])}` : now < s.set[0] ? `SUNSET ${f(s.set[0])}` : s.rise[1] ? `SUNRISE ${f(s.rise[1])}` : PLACE.name) + ' · ' + PLACE.name;

  if (DEMO === 'night') return true;
  const s = sunTimes(), now = Date.now();
  if (s && now < s.rise[0] + 86400e3) return now < s.rise[0] || now >= s.set[0];
  const h = new Date().getHours(); return h >= 19 || h < 7;

// ---- is each service answering? (a HEAD to its page: no n8n, nothing paid) ----

// ---- the Pit's notebook: the HUB keeps its OWN sign-in. Sharing the Pit page's would rotate its refresh token
//      under it and Supabase would sign both out, so the HUB never touches 'pit.session'. ----
const PIT = { cfg: null, inflight: null };
function pitConfig() { return PIT.cfg || (PIT.cfg = window.PIT_CONFIG && window.PIT_CONFIG.supabaseUrl ? window.PIT_CONFIG : null); }
function loadPitConfig() {
  return new Promise(ok => {
    if (pitConfig() || S.pitIx < 0) return ok();
    const sc = doc.createElement('script');
    sc.src = new URL('../the-pit/config.js', location.href).href;   // the Pit's own public settings: one source
    sc.onload = sc.onerror = () => ok(); doc.head.appendChild(sc);
  });
}
function pitSession() { return store.get('hub.pit'); }
function pitSave(j, email) {
  const s = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + ((j.expires_in || 3600) - 60) * 1000, email: email || (j.user && j.user.email) || (pitSession() || {}).email || '' };
  store.set('hub.pit', s); return s;
}
async function pitToken() {
  const s = pitSession(), cfg = pitConfig(); if (!s || !cfg) return null;
  if (s.expires_at > Date.now()) return s.access_token;
  if (!PIT.inflight) PIT.inflight = (async () => {
    const r = await fetchT(`${cfg.supabaseUrl}/auth/v1/token?grant_type=refresh_token`, 9000, { method: 'POST', headers: { apikey: cfg.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    if (r.status === 400 || r.status === 401) { store.del('hub.pit'); return null; }   // revoked: link again
    if (!r.ok) throw new Error('refresh ' + r.status);
    return pitSave(await r.json(), s.email).access_token;
  })().finally(() => { PIT.inflight = null; });
  return PIT.inflight;
}
async function pitGet(path) {
  const cfg = pitConfig(), tok = await pitToken(); if (!tok) throw new Error('unlinked');
  const r = await fetchT(`${cfg.supabaseUrl}/rest/v1/${path}`, 9000, { headers: { apikey: cfg.supabaseKey, Authorization: 'Bearer ' + tok } });
  if (r.status === 401) { const s = pitSession(); if (s) { s.expires_at = 0; store.set('hub.pit', s); } throw new Error('expired'); }
  if (!r.ok) throw new Error(r.status + '');
  return r.json();
}
function shapeCook(row, rd) {
  const st = row.state || {}, plan = st.plan || {}, roles = Array.isArray(plan.probes) ? plan.probes : [], map = st.probes || {};
  const tracks = plan.tracks || {}, phase = row.status === 'paused' ? 'paused' : st.phase || 'cook';
  const meats = roles.map(role => {
    const id = map[role], t = rd && rd.probes ? rd.probes[id] : null, tr = tracks[role], until = tr && tr[0] && tr[0].until;
    return { name: String(role).replace(/_/g, ' '), t: typeof t === 'number' && t >= 1 && t <= 500 ? t : null, target: until && until.at_least ? +until.at_least : null };
  });
  const at = rd ? new Date(rd.at).getTime() : 0, age = Date.now() - at;
  return { id: row.id, name: row.meat || plan.name || 'Cook', phase, phaseLabel: { cook: 'COOKING', rest: 'RESTING', hold: 'HOLDING', paused: 'PAUSED' }[phase] || String(phase).toUpperCase(),
    started: new Date(row.started_at || st.startedAt || Date.now()).getTime(), pit: rd ? rd.pit : null, set: rd ? rd.setpoint : null,
    meat: meats.find(m => m.t != null) || meats[0] || null, meats, stale: !rd || age > 4 * MIN, staleMin: rd ? Math.round(age / MIN) : 0 };
}
async function pitPoll() {
  clearTimeout(pitPoll.t);

    if (DEMO === 'cook' || S.demoCook) { S.cook = demoCook(); S.pit = 'cook'; }
    else if (!pitConfig()) S.pit = 'none';
    else if (!pitSession()) { S.pit = 'unlinked'; S.cook = null; }
    else try {
      const rows = await pitGet('cooks?status=in.(running,paused)&order=started_at.desc&limit=1&select=id,meat,status,state,started_at');
      if (!rows.length) {

async function boot() {
  const log = $('boot-log'), line = $('boot-line');
  const skip = Q.get('boot') === '0';
  const checks = checkAll(), wx = weather(true);
  const rows = [['ARC CORE', Promise.resolve('ok')]].concat(S.svc.map((s, i) => [s.name.toUpperCase(), s.url ? checks.then(r => r[i] === 'on' ? 'ok' : 'bad') : Promise.resolve('unset')]),
    [['WEATHER', wx.then(() => S.wx && !S.wxErr ? 'ok' : 'bad')]]);
  const label = { ok: '<b class="ok">ONLINE</b>', bad: '<b class="bad">NO ANSWER</b>', unset: '<b class="wait">NOT SET UP</b>' };
  const pad = s => (s + ' ').padEnd(17, '·') + ' ';
  const state = rows.map(() => '<b class="wait">· · ·</b>');
  const draw = n => { log.innerHTML = rows.slice(0, n).map((r, k) => `<em>${pad(r[0])}</em>${state[k]}`).join('\n'); };
  if (skip) { finishBoot(); return; }
  let shown = 0, done = false;
  const tap = () => { done = true; finishBoot(); };
  doc.addEventListener('pointerdown', tap, { once: true });
  requestAnimationFrame(() => { line.style.transform = 'scaleX(1)'; });

  for (let k = 1; k <= rows.length && !done; k++) { await sleep(170); shown = k; draw(k); }
  await Promise.race([Promise.all(rows.map(r => r[1])), sleep(2200)]);

function hourFlare() {
  const f = doc.querySelector('#reactor .flare'); if (!f) return;

const T = {}, SND = {};

    + (run ? '<p class="left" id="tm-left"></p>' : '<p>Pick a time. It counts down on the reactor; at zero the reactor flares and chimes until you touch the screen.</p>')
    + `<div class="tgrid">${[1, 3, 5, 10, 15, 20, 30, 45, 60, 90, 120, 180].map(m => `<button type="button" data-min="${m}">${m === 60 || m > 90 ? m / 60 + ' H' : m + ' MIN'}</button>`).join('')}</div>`
    + (run ? '<div class="row"><button type="button" data-add="1">+1 MIN</button><button type="button" data-add="5">+5 MIN</button><button type="button" id="tm-stop">STOP</button></div>' : '')
    + '<div class="row"><button type="button" id="sh-x">CLOSE</button></div>';

// holidays, on the day only: the dust and the orbit's sparks wear the day's colors, and the greeting says so
const HELLO = {
  halloween: () => 'HAPPY HALLOWEEN', thanksgiving: () => 'HAPPY THANKSGIVING', july4: () => 'HAPPY 4TH OF JULY',
  xmas: d => d.getMonth() === 11 && d.getDate() === 24 ? 'MERRY CHRISTMAS EVE' : 'MERRY CHRISTMAS',
  newyear: d => d.getMonth() === 11 ? "HAPPY NEW YEAR'S EVE" : 'HAPPY NEW YEAR',
};
function holiday(d) {
  const f = Q.get('holiday'); if (f && HELLO[f]) return f;   // ?holiday=halloween shows one on any day
  const m = d.getMonth() + 1, day = d.getDate();
  return m === 10 && day === 31 ? 'halloween' : m === 11 && d.getDay() === 4 && day >= 22 && day <= 28 ? 'thanksgiving'
    : m === 12 && (day === 24 || day === 25) ? 'xmas' : (m === 12 && day === 31) || (m === 1 && day === 1) ? 'newyear' : m === 7 && day === 4 ? 'july4' : '';
}

    body.classList.toggle('yt-on', YT.playing());
    doc.querySelectorAll('#yt-ch .ch').forEach(b => b.classList.toggle('on', b.dataset.k === YT.k));
    $('yt-idle').hidden = YT.playing();
    $('yt-name').textContent = c ? c.short.toUpperCase() : 'YOUTUBE';
    $('yt-hint').textContent = hint || 'PICK A CHANNEL BELOW · SELECT IT AGAIN TO STOP';
  },
};
window.addEventListener('message', e => {   // the player says when a stream has ended (a channel's video id goes stale: the Lounge's 09-17 lesson)
  const f = $('yt-scr').querySelector('iframe'); if (!f || e.source !== f.contentWindow) return;
  let d = null; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
  const err = d && (d.event === 'onError' ? d.info : d.info && d.info.errorCode);
  if (err) { const name = $('yt-name').textContent; YT.stop(); YT.paint(`${name} HAS ENDED (YOUTUBE ${err}) · PICK ANOTHER`); }
});

// ---- the news on a TV: the Lounge's five free feeds read by this page (0 n8n runs), his order of interest first ----
const NEWS = {
  items: [], at: 0,
  async load() {
    if (!S.tv || NEWS.busy) return;
    NEWS.busy = true;
    const got = [];
    await Promise.all(LOUNGE.FEEDS.map(f => fetchT(f.url, 12000).then(r => r.ok ? r.text() : '').then(x => { if (x) got.push(...LOUNGE.feedItems(x, f)); }).catch(() => {})));
    NEWS.busy = false;
    if (got.length) {
      const seen = new Set(), t = h => Date.parse(h.t || '') || 0;
      NEWS.items = got.filter(h => !seen.has(h.title) && seen.add(h.title)).sort((a, b) => LOUNGE.newsRank(a) - LOUNGE.newsRank(b) || t(b) - t(a));
      NEWS.at = Date.now();
    }
    NEWS.paint();
  },
  paint() {
    const box = $('news-l'), had = TV.cur && TV.cur.classList.contains('nw') ? [...box.children].indexOf(TV.cur) : -1;
    box.innerHTML = '';
    NEWS.items.slice(0, 8).forEach(h => {
      const a = doc.createElement('a'); a.className = 'nw'; a.href = h.link;
      a.innerHTML = `<small>${esc(h.src.toUpperCase())}${h.t ? ' · ' + esc(LOUNGE.ago(h.t).toUpperCase()) : ''}</small><span>${esc(h.title)}</span>`;
      box.appendChild(a);
    });
    fitNews();
    $('news-at').textContent = NEWS.at ? 'UPDATED ' + hm(new Date(NEWS.at)) : NEWS.items.length ? '' : 'LOADING…';
    if (had >= 0) TV.ring(box.children[Math.min(had, box.children.length - 1)] || null);
  },
};

// a story that does not fit whole stays out (no half rows). Measured again on every layout and when the page shows again:
// the stick once hid them all, deciding while the page was hidden behind Netflix (10-29)
function fitNews() {
  const box = $('news-l'); if (!box || !S.tv) return;
  const r = box.getBoundingClientRect(); if (r.height < 40 || doc.hidden) return;   // not measurable now: decide later
  [...box.children].forEach(a => { a.hidden = false; });
  [...box.children].forEach(a => { a.hidden = a.getBoundingClientRect().bottom > r.bottom + 1; });
}
doc.addEventListener('visibilitychange', () => { if (!doc.hidden) fitNews(); });

// ---- a remote (the Fire TV Stick, 10-29): the arrows move a gold ring by direction, Select presses, the clock is the timer ----
// The app says `tv` in its services and hands the stick's arrows and Select to this page as ArrowLeft/Right/Up/Down and Enter.
// The ring walks the apps (Up/Down along their ring), the clock, the pods, the link chip, the YouTube channels, the news and the
// gear; inside a sheet, that sheet's buttons and fields. The channels are a row that scrolls: the ring lands only on the ones
// in sight, and Left/Right walk it. While one plays, Up is the picture: Select is full screen, Back stops it.
// YouTube full screen: Left/Right change the channel, Select or Back leave it.
const TV = {
  cur: null, back: null,
  targets() {
    const shown = e => e && e.getClientRects().length && getComputedStyle(e).visibility !== 'hidden';
    if (S.sheet) return [...$('sheet').querySelectorAll('button:not([disabled]),input')].filter(shown);
    const nl = $('news-l').getBoundingClientRect();
    const rows = [...doc.querySelectorAll('.nw')].filter(e => !e.hidden && e.getBoundingClientRect().bottom <= nl.bottom + 1);   // only rows that fit
    const cb = $('yt-ch').getBoundingClientRect();   // the row scrolls: a chip scrolled out of sight is no target (10-29: the ring vanished onto one)
    const chips = [...doc.querySelectorAll('#yt-ch .ch')].filter(e => { const r = e.getBoundingClientRect(); return r.left >= cb.left - 1 && r.right <= cb.right + 1; });
    return [...doc.querySelectorAll('.tapp'), ...doc.querySelectorAll('.pod:not(.off)'), ...doc.querySelectorAll('.chip'), $('clock'),
      YT.playing() ? $('yt-scr') : null, ...chips, ...rows, $('gear')].filter(shown);
  },
  ring(el) {
    if (TV.cur) TV.cur.classList.remove('cur');
    TV.cur = el || null;
    const app = !!(el && el.classList.contains('tapp'));
    body.classList.toggle('tv-app', app); $('appname').textContent = app ? el.dataset.name.toUpperCase() : '';
    if (!el) return;
    el.classList.add('cur');
    if (el.classList.contains('ch')) { const box = $('yt-ch'), r = el.offsetLeft + el.offsetWidth / 2 - box.clientWidth / 2; box.scrollLeft = Math.max(0, r); }
    if (el.tagName === 'INPUT') el.focus(); else if (doc.activeElement && doc.activeElement.tagName === 'INPUT') doc.activeElement.blur();
  },
  home() {
    const t = TV.targets(), pit = t.find(e => e.classList.contains('pit'));
    TV.ring((S.cook && pit) || t.find(e => e.classList.contains('tapp')) || pit || t[0] || null);
  },
  move(dx, dy) {
    const t = TV.targets(); if (!t.length) return;
    if (!TV.cur || !t.includes(TV.cur)) { TV.settle(0); return; }
    if (TV.cur.classList.contains('tapp')) {   // on the apps ring: Up and Down walk it; Left is its outside
      const apps = t.filter(e => e.classList.contains('tapp')), i = apps.indexOf(TV.cur);
      if (dy) { const n = apps[i + (dy > 0 ? 1 : -1)]; if (n) TV.ring(n); return; }
      if (dx < 0) return;
    }
    if (TV.cur.classList.contains('ch') && dx) {   // the channels: Left/Right walk the row in order and it scrolls; the first one's Left leaves it
      const row = [...doc.querySelectorAll('#yt-ch .ch')], n = row[row.indexOf(TV.cur) + dx];
      if (n) { TV.ring(n); return; }
      if (dx > 0) return;
    }
    if (TV.cur.classList.contains('ch') && dy < 0 && YT.playing()) { TV.ring($('yt-scr')); return; }   // the picture is big: by its middle it loses to the link chip
    if (TV.cur === $('yt-scr') && dy > 0) { TV.ring(doc.querySelector('#yt-ch .ch.on') || doc.querySelector('#yt-ch .ch')); return; }
    const fromApp = TV.cur.classList.contains('tapp');
    const c = TV.mid(TV.cur); let best = null, score = Infinity;
    for (const e of t) {
      if (e === TV.cur || (fromApp && e.classList.contains('tapp'))) continue;
      const m = TV.mid(e), vx = m.x - c.x, vy = m.y - c.y, along = vx * dx + vy * dy;
      if (along <= 8) continue;                              // not in the arrow's direction
      const s = along + Math.abs(vx * dy - vy * dx) * 2.2;    // the nearer, and the closer to the arrow's line, the better
      if (s < score) { score = s; best = e; }
    }
    if (best) TV.ring(best);
  },
  press() {
    const t = TV.targets(), e = TV.cur;
    if (!e || !t.includes(e)) { TV.settle(0); return; }
    if (!S.sheet) TV.back = e;                                // where to return when a sheet closes
    if (e === $('clock')) openTimer(); else if (e === $('yt-scr')) { YT.setFull(true); return; } else if (e.tagName === 'INPUT') { e.focus(); return; } else e.click();
    TV.settle(80);
  },
  /** After a press or Back: a sheet may have opened or closed; the ring lands on the right thing. */
  settle(ms) {
    setTimeout(() => {
      if (YT.full) return;                                    // full screen: the ring waits under the picture
      const t = TV.targets();
      if (TV.cur && t.includes(TV.cur)) return;
      TV.ring(t.includes(TV.back) ? TV.back : t.find(e => e.classList.contains('pit')) || t[0] || null);
    }, ms);
  },
  mid(e) { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; },
};
doc.addEventListener('keydown', e => {   // capture: it sees a sheet before the sheet's own Escape closes it
  if (!S.tv) return;
  const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (YT.full) {                                              // full screen: Left/Right change the channel, Select or Back leave, the rest waits
    e.preventDefault();
    if (e.key === 'Escape' || e.key === 'Enter') { YT.setFull(false); TV.ring($('yt-scr')); return; }
    if (d && d[0]) YT.next(d[0]);
    return;
  }
  if (d) { e.preventDefault(); TV.move(d[0], d[1]); }
  else if (e.key === 'Enter') { if (e.target && e.target.tagName === 'INPUT') return; e.preventDefault(); TV.press(); }
  else if (e.key === 'Escape') { if (!S.sheet && YT.playing()) YT.stop(); TV.settle(80); }   // a sheet: its own Escape closes it
}, true);
// the YouTube player can take the keyboard (10-29: Back did nothing in full screen, the keys went into the player): take it back
window.addEventListener('blur', () => setTimeout(() => {
  const a = doc.activeElement; if (S.tv && a && a.tagName === 'IFRAME') { a.blur(); window.focus(); }
}, 0));

// ---- start ----
if (APP) body.classList.add('app');
loadServices(); drawRings(); buildPods(); layout(true);
if (S.tv) {
  YT.build(); APPS.load(); NEWS.paint(); NEWS.load(); TV.home();
  setInterval(() => { if (!doc.hidden) NEWS.load(); }, 15 * 60e3);
}
addOns();
S.wx = store.get('hub.wx'); renderWx(); tick(); motes();
setInterval(idleTick, 5000);
S.checkedAt = Date.now();
loadPitConfig().then(pitPoll);
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
